<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Space GNC Responsive Preview</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        background: #171b20;
        color: #eef5f5;
        margin: 0;
        padding: 18px;
        font-family: Arial, Helvetica, sans-serif;
      }

      .preview-grid {
        grid-template-columns: 768px 390px;
        justify-content: center;
        gap: 24px;
        display: grid;
      }

      .device {
        min-width: 0;
      }

      .device-label {
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin: 0 0 9px;
        font-size: 11px;
      }

      iframe {
        background: #fff;
        border: 1px solid #ffffff2b;
        width: 100%;
        height: 860px;
        display: block;
      }
    </style>
  </head>
  <body>
    <main class="preview-grid">
      <section class="device">
        <p class="device-label">Tablet · 768 px</p>
        <iframe id="tablet" title="Tablet website preview"></iframe>
      </section>
      <section class="device">
        <p class="device-label">Phone · 390 px</p>
        <iframe id="phone" title="Phone website preview"></iframe>
      </section>
    </main>
    <script>
      const updateFrames = () => {
        const section = window.location.hash || "#top";
        document.querySelector("#tablet").src =
          `./preview-july.html?v=20260728-2${section}`;
        document.querySelector("#phone").src =
          `./preview-july.html?v=20260728-2${section}`;
      };

      window.addEventListener("hashchange", updateFrames);
      updateFrames();
    </script>
  </body>
</html>
